# Shin4Static's own BIRD instance (s4s-bird). The system /opt/etc/bird.conf
# and any other bird (e.g. Bird4Static) are not involved.

log syslog name "s4s-bird" { warning, error, fatal, bug };

# Any unique IPv4; it is only an identifier.
router id 10.255.255.31;

protocol device {
	scan time 10;
}

include "/opt/etc/shin4static/gen/shin4static.conf";
